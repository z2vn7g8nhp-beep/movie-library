/* ================================================================ 离线索引 */
const IDX_BASE = "idx/";
function parseIdx(text){
  const out = [];
  for (const line of text.split("\n")) {
    if (!line) continue;
    const x = line.split("\t");
    const alt = x[7] ? x[7].split("|") : [];
    const row = {id: "tt" + x[0], t: x[1], y: +x[2] || 0, ey: +x[3] || 0, n: x[4], o: x[5], cn: x[6],
      g: parseInt(x[8] || "0", 16), r: +x[9] || 0, v: +x[10] || 0, h: x[11] === undefined || x[11] === "" ? -1 : +x[11]};
    row.hv = Math.max(row.v, row.h >= 0 ? Math.floor(3e6 / (row.h + 10)) : 0);   // 待映片没人打分，用热度排名换算
    row.k = "\u0001" + [row.cn, ...alt, row.n, row.o].filter(Boolean).map(norm).join("\u0001") + "\u0001";
    out.push(row);
  }
  return out;
}
async function loadIndex(){
  try {
    const info = await (await fetch(IDX_BASE + "info.json", {cache: "no-cache"})).json();
    S.idxInfo = info;
    const v = encodeURIComponent(info.built);
    for (const [i, f] of ["s1", "s2"].entries()) {
      const r = await fetch(`${IDX_BASE}${f}.txt?v=${v}`);
      if (!r.ok) throw new Error(r.status);
      const rows = parseIdx(await r.text());
      for (const row of rows) { S.idx.push(row); S.byId.set(row.id, row); }
      S.idxReady = i + 1; bump();
      if (i === 0) preloadCrew();
      if (route().name === "search") renderSearchResults();
      else if (i === 0 || route().name === "p") render();
    }
  } catch (e) {
    S.idxReady = -1;
    if (route().name === "search") render();
  }
}
async function shard(kind, key){
  const map = kind === "p" ? S.shardP : S.shardN;
  const n = kind === "p" ? (S.idxInfo?.shards || 512) : (S.idxInfo?.nshards || 256);
  const i = parseInt(key.slice(2), 10) % n;
  if (!map.has(i)) map.set(i, (async () => {
    const out = new Map();
    try {
      const v = encodeURIComponent(S.idxInfo?.built || "");
      const text = await (await fetch(`${IDX_BASE}${kind}/${i}.txt?v=${v}`)).text();
      for (const line of text.split("\n")) {
        if (!line) continue;
        const x = line.split("\t");
        if (kind === "p") {
          const ppl = s => (s ? s.split("|") : []).map(p => { const j = p.indexOf(":"); return {id: "nm" + p.slice(0, j), n: p.slice(j + 1)}; });
          const rec = {poster: x[1], rt: +x[2] || 0, d: ppl(x[3]), c: ppl(x[4])};
          out.set("tt" + x[0], rec); S.crew.set("tt" + x[0], rec);
        } else {
          out.set("nm" + x[0], {n: x[1], dir: x[2] ? x[2].split("|").map(i => "tt" + i) : [], act: x[3] ? x[3].split("|").map(i => "tt" + i) : []});
        }
      }
    } catch { map.delete(i); }
    return out;
  })());
  return (await map.get(i)).get(key);
}
async function preloadCrew(){
  const ids = active().map(([id]) => id).filter(id => !S.meta[id] || S.meta[id].light || !S.meta[id].cast);
  await Promise.all(ids.slice(0, 400).map(id => shard("p", id)));
  if (ids.length) bump();
  if (ids.length && ["home", "lib", "stats"].includes(route().name)) render();
}
let namesP;
function loadNames(){
  return namesP || (namesP = fetch(`${IDX_BASE}names.txt?v=${encodeURIComponent(S.idxInfo?.built || "")}`).then(r => r.text()).then(t =>
    t.split("\n").filter(Boolean).map(l => { const x = l.split("\t"); return {id: "nm" + x[0], n: x[1], c: +x[2], k: norm(x[1])}; }))
    .catch(() => { namesP = null; return []; }));
}

/* ================================================================ 片子信息（合并 详情 + 索引 + 分片） */
function vm(id){
  const m = S.meta[id] && !S.meta[id].missing ? S.meta[id] : null, x = S.byId.get(id);
  const t = typeCode(m?.type || x?.t);
  const genres = m?.dgenres?.length ? m.dgenres : (m?.genres || (x ? (S.idxInfo?.genres || []).filter((g, i) => x.g & (1 << i)) : []))
    .map(g => GENRE_ZH[g] || g);
  const primary = m?.title || x?.n || id;
  const cn = m?.cn || x?.cn || "";
  return {
    id, t, series: isSeries(t), m, x,
    name: cn || primary, sub: cn ? (m?.orig || x?.o || primary) : (m?.orig || x?.o || ""),
    year: m?.year || x?.y || 0, ey: m?.ey || x?.ey || 0,
    genres: genres.filter(g => g !== "短片" || t === "m"),
    imdb: m?.imdb?.v ? m.imdb : (x?.r ? {v: x.r, c: x.v} : null),
    douban: m?.douban || null, rt: m?.rt || null,
    poster: m?.dpic || "", posterKey: m?.poster || "",
  };
}
const seenImg = new Set();   // 加载过的海报，再出现时不再淡入
function imgOk(i){ i.classList.add("ok"); seenImg.add(i.src); }
const dbSmall = (u, w) => u && w <= 240 ? u.replace("/m_ratio_poster/", "/s_ratio_poster/").replace("/l_ratio_poster/", "/s_ratio_poster/") : u;
let eagerImgs = false;   // 横排、首屏的图立刻加载；长列表才等滚到附近再加载
function posterHTML(v, w = 200, badge = ""){
  const src = dbSmall(v.poster, w) || imdbImg(v.posterKey, w);
  return `<div class="ps${mark(v.id)?.s === "done" ? " got" : ""}" data-pid="${v.id}" data-w="${w}">${src ? `<img ${eagerImgs ? "" : 'loading="lazy" '}decoding="async" src="${esc(src)}"${seenImg.has(src) ? ' class="ok"' : ""} onload="imgOk(this)" onerror="posterErr(this)">` : ""}`
    + `<div class="ph">${esc(v.name)}</div>${badge}</div>`;
}
function dropImg(u){ try { caches.open("yingku-img-v1").then(c => c.delete(u)); } catch {} }   // 坏图别留在缓存里
function posterErr(img){
  dropImg(img.src);
  const box = img.closest(".ps"); if (!box) { img.remove(); return; }
  const v = vm(box.dataset.pid);
  const alt = imdbImg(v.posterKey, +box.dataset.w || 200);
  if (!img.dataset.src0) img.dataset.src0 = img.getAttribute("src");
  if (alt && img.src !== alt && !img.dataset.tried) { img.dataset.tried = 1; img.src = alt; }
  else { const parent = box.parentElement; img.remove(); if (!box.dataset.h) hydratePosters(parent); }   // 再从离线片库里找海报
}
/* 没有海报的格子，按需从分片里补 */
async function hydratePosters(root = document){
  const boxes = [...root.querySelectorAll(".ps:not([data-h])")].filter(b => !b.querySelector("img"));
  for (const b of boxes) {
    b.dataset.h = 1;
    shard("p", b.dataset.pid).then(p => {
      if (!p?.poster || !b.isConnected) return;
      const img = new Image();
      if (!b.closest(".scroller,.hero,.pstat") ) img.loading = "lazy";
      img.decoding = "async";
      const src = imdbImg(p.poster, +b.dataset.w || 200);
      if (seenImg.has(src)) img.className = "ok";
      img.onload = () => imgOk(img); img.onerror = () => img.remove();
      img.src = src;
      b.prepend(img);
    });
  }
}
function starsHTML(n10){   // 10 分制 → 5 颗星
  const s = Math.round((n10 || 0)) / 2;
  return `<span class="stars">${[1,2,3,4,5].map(i => `<i class="${s >= i ? "f" : s >= i - .5 ? "h" : ""}"></i>`).join("")}</span>`;
}
function myStars(r){ return r ? `<span class="stars">${[1,2,3,4,5].map(i => `<i class="${r >= i ? "f" : ""}"></i>`).join("")}</span>` : ""; }
function scoreHTML(v, which = ["db", "im", "tm"]){
  const out = [];
  if (which.includes("db")) out.push(v.douban?.v ? `<span class="sc"><i class="db">豆</i>${v.douban.v.toFixed(1)}</span>` : "");
  if (which.includes("im")) out.push(v.imdb?.v ? `<span class="sc"><i class="im">IMDb</i>${(+v.imdb.v).toFixed(1)}</span>` : "");
  if (which.includes("tm")) out.push(v.rt?.critics != null ? `<span class="sc"><i class="tm">番茄</i>${v.rt.critics}%</span>` : "");
  return out.join("");
}
const mark = id => { const k = S.marks[id]; return k && !k.del ? k : null; };
const active = () => Object.entries(S.marks).filter(([, k]) => !k.del);

function shelfItem(id, extra = ""){
  const v = vm(id), k = mark(id);
  let mt = "";
  if (k?.s === "done") mt = k.r ? myStars(k.r) : (v.douban?.v ? `豆瓣 ${v.douban.v.toFixed(1)}` : v.year || "");
  else if (k?.s === "doing" && v.series) {
    const seen = (k.ss || []).length, tot = v.m?.seasons || 0;
    mt = seen ? `看到第 ${Math.max(...k.ss)} 季${tot ? ` / 共 ${tot} 季` : ""}` : (tot ? `共 ${tot} 季` : "在看");
    if (tot) extra += `<div class="prog"><i style="width:${Math.min(100, seen / tot * 100)}%"></i></div>`;
  } else mt = [v.year || "", v.douban?.v ? `豆瓣 ${v.douban.v.toFixed(1)}` : v.imdb?.v ? `IMDb ${(+v.imdb.v).toFixed(1)}` : ""].filter(Boolean).join(" · ");
  return `<a class="shelf-item" href="#/t/${id}">${posterHTML(v, 220)}<div class="nm">${esc(v.name)}</div><div class="mt">${mt}</div>${extra}</a>`;
}

/* ================================================================ 路由 */
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const [name, arg] = h.split("/");
  return {name: name || "home", arg: decodeURIComponent(arg || "")};
}
const scrollMem = {};
let lastKey = "";
let depth = 0, goingBack = false;
window.addEventListener("hashchange", () => { closeSheet(); scrollMem[lastKey] = PAGES.includes(lastKey.split("/")[0]) ? $("#page").scrollTop : scrollY; if (goingBack) { depth = Math.max(0, depth - 1); goingBack = false; } else depth++; render(true); });
function go(h){ location.hash = h; }
function back(){ if (depth > 0) { goingBack = true; history.back(); } else go("#/home"); }

/* 重画时，把已经显示过的图片元素原样搬进新页面（不重新下载、不重新解码，就不会闪一下空白） */
function keepImages(root, ret){
  const bySrc = new Map(), byBox = new Map();
  root.querySelectorAll("img").forEach(i => {
    if (!i.complete || !i.naturalWidth) return;
    const k = i.dataset.src0 || i.getAttribute("src");
    if (!bySrc.has(k)) bySrc.set(k, i);
    const box = i.closest(".ps");
    if (box && !byBox.has(box.dataset.pid + "@" + box.dataset.w)) byBox.set(box.dataset.pid + "@" + box.dataset.w, i);
  });
  const take = (map, k) => { const o = map.get(k); if (o) map.delete(k); return o; };
  const swap = () => {
    root.querySelectorAll("img").forEach(n => {
      const o = take(bySrc, n.getAttribute("src"));
      if (o && o !== n && !o.isConnected) { o.classList.add("ok"); n.replaceWith(o); }
    });
    root.querySelectorAll(".ps").forEach(b => {   // 新页面里还没图的格子（海报是后来从分片补的）
      if (b.querySelector("img")) return;
      const o = take(byBox, b.dataset.pid + "@" + b.dataset.w);
      if (o && !o.isConnected) { o.classList.add("ok"); b.prepend(o); b.dataset.h = 1; }
    });
    hydratePosters(root);
  };
  return Promise.resolve(typeof ret === "function" ? ret() : ret).then(swap);
}
/* 底部四个页面渲染在 #main 里，详情、影人页等在 #page 里。
   进详情时 #main 只是藏起来，返回时原样显示，不重画、滚动位置不变；数据变了（S.ver 变了）才重画。 */
const PAGES = ["t", "p", "quick", "settings"];
let mainKey = "", mainVer = -1;
const bump = () => { S.ver = (S.ver || 0) + 1; };
function render(nav){
  const r = route(), key = r.name + "/" + r.arg;
  const isPage = PAGES.includes(r.name);
  const main = $("#main"), page = $("#page");
  $("#app").className = isPage ? "page" : "";
  $$(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === r.name));
  if (isPage) {
    const entering = page.hidden;
    page.hidden = false;
    if (nav && entering) { page.classList.remove("out"); page.classList.remove("in"); void page.offsetWidth; page.classList.add("in"); }
    const done = keepImages(page, () => ({t: renderTitle, p: renderPerson, quick: renderQuick, settings: renderSettings})[r.name](r.arg));
    if (nav) { page.scrollTop = scrollMem[key] || 0; done.then(() => { if (route().name + "/" + route().arg === key) page.scrollTop = scrollMem[key] || 0; }); }
  } else {
    if (!page.hidden) {   // 关掉详情层：列表一直在底下，没被隐藏过，图片和位置都还在
      if (nav) { page.classList.remove("in"); page.classList.add("out"); setTimeout(() => { if (!PAGES.includes(route().name)) { page.hidden = true; page.innerHTML = ""; page.classList.remove("out"); } }, 200); }
      else { page.hidden = true; page.innerHTML = ""; }
    }
    main.hidden = false;
    let reuse = nav && mainKey === key && mainVer === (S.ver || 0);
    if (nav && mainKey === key && !reuse && r.name === "search") {
      // 搜索结果原样保留，只刷新每一行的标记状态（重新搜一遍会丢掉滚动位置）
      main.querySelectorAll("#res a.lrow").forEach(a => { const id = a.getAttribute("href").split("/").pop(); a.outerHTML = listRow(id); });
      hydratePosters(main); mainVer = S.ver || 0; reuse = true;
    }
    const sameTab = mainKey === key;
    if (!reuse) {
      keepImages(main, () => ({home: renderHome, lib: renderLib, search: renderSearch, stats: renderStats}[r.name] || renderHome)(r.arg));
      mainKey = key; mainVer = S.ver || 0;
    }
    if (nav && !sameTab) { const y = scrollMem[key] || 0; scrollTo(0, y); requestAnimationFrame(() => scrollTo(0, y)); }
  }
  lastKey = key;
}

      <div class="num"><div><b>${films}</b><span>部电影</span></div><div><b>${shows}</b><span>部剧集</span></div><div><b>${thisYear}</b><span>今年看过</span></div></div>
      <div class="row2"><a href="#/lib" onclick="libFilter({s:'doing'})"><i style="background:var(--doing)"></i>在看 <b>${doing.length}</b></a>
        <a href="#/lib" onclick="libFilter({s:'wish'})"><i style="background:var(--wish)"></i>想看 <b>${wish.length}</b></a>
        <a href="#/quick">${"⚡"} 快速标记</a></div></div>
    ${doing.length ? shelfSec("在看", doing, "doing") : ""}
    ${done.length ? shelfSec("最近看过", done.slice(0, 20), "done", done.length) : ""}

function idFromText(s){

function searchIdx(q){
  let yr = 0; q = q.replace(/(^|\s)((?:19|20)\d{2})(\s|$)/, (a, b, y) => { yr = +y; return " "; });
  const nq = norm(q);
  if (!nq) return [];
  const hits = [];
  const consider = (row, k) => {
    const i = k.indexOf(nq); if (i < 0) return;
    if (yr && Math.abs((row.y || 0) - yr) > 1) return;
    const exact = k.includes("\u0001" + nq + "\u0001"), pre = k[i - 1] === "\u0001";
    hits.push({id: row.id, s: (exact ? 3 : pre ? 2 : 1) * 1e9 + (row.hv || row.v || 0) + (mark(row.id) ? 5e8 : 0)});
  };
  for (const row of S.idx) consider(row, row.k);
  for (const [id, m] of Object.entries(S.meta)) {   // 不在索引里的冷门片（在线搜到、手动加的）
    if (S.byId.has(id) || m.missing) continue;
    consider({id, y: m.year, v: m.imdb?.c || 0}, "\u0001" + [m.cn, m.title, m.orig].filter(Boolean).map(norm).join("\u0001") + "\u0001");
  }
  hits.sort((a, b) => b.s - a.s);
  return hits.slice(0, 60).map(h => h.id);
}

function tint(v){

  const run = () => { try {
    const c = document.createElement("canvas"); c.width = c.height = 8;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, 8, 8);
    const d = x.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0;

}

function setMark(id, patch){

  if (patch === null) S.marks[id] = {del: true, t: now};
  else {

    S.marks[id] = {...old, ...patch, t: now};
    delete S.marks[id].del;
    if (!S.meta[id] || S.meta[id].light || S.meta[id].missing) S.pending.add(id);

  scheduleSave();
}

const BADGES = [
  {k: "first", n: "入坑", ic: "🌱", t: (s) => s >= 1, need: (s, tot) => 1 - s},
  {k: "five", n: "五部达成", ic: "🎞", t: (s) => s >= 5, need: (s) => 5 - s},
  {k: "ten", n: "十部达成", ic: "🌟", t: (s) => s >= 10, need: (s) => 10 - s},
  {k: "quarter", n: "四分之一", ic: "🍀", t: (s, tot) => tot && s / tot >= .25, need: (s, tot) => Math.ceil(tot * .25) - s},
  {k: "half", n: "半壁江山", ic: "🌗", t: (s, tot) => tot && s / tot >= .5, need: (s, tot) => Math.ceil(tot * .5) - s},
  {k: "most", n: "骨灰级", ic: "💎", t: (s, tot) => tot && s / tot >= .8, need: (s, tot) => Math.ceil(tot * .8) - s},
  {k: "all", n: "大满贯", ic: "👑", t: (s, tot) => tot && s >= tot, need: (s, tot) => tot - s},
];
function worksFromP(P){
  const thisYear = new Date().getFullYear();
  return P.credits.map(c => {
    const series = ["tvSeries", "tvMiniSeries"].includes(c.ty);
    const self = c.cats.length === 1 && c.cats[0] === "self";
    const guest = !self && series && c.ty === "tvSeries" && c.eps && c.eps <= 2 && !c.cats.includes("director");
    const upcoming = (c.y && c.y > thisYear) || (!c.v && (!c.y || c.y >= thisYear));
    return {...c, series, guest, self, upcoming, dir: c.cats.includes("director"), act: c.cats.includes("actor")};
  });
}
function personStat(nm){   // 追的人的集邮进度（有完整资料才算）
  const P = S.persons[nm]; if (!P) return null;
  const ws = worksFromP(P), pr = progressOf(ws);
  return {ws, seen: pr.seen.length, tot: pr.main.length, pr};
}
const earned = (seen, tot) => BADGES.filter(b => b.t(seen, tot));
function nextBadge(seen, tot){ const b = BADGES.find(b => !b.t(seen, tot) && b.need(seen, tot) > 0 && (b.k !== "all" || tot)); return b ? {...b, left: b.need(seen, tot)} : null; }
function badgeRow(seen, tot){
  return `<div class="badges">${BADGES.map(b => `<span class="bd2 ${b.t(seen, tot) ? "on" : ""}"><i>${b.ic}</i>${b.n}</span>`).join("")}</div>`;
}
/* 片子里有我追的人：盖章前后比一下，出提示 / 解锁仪式 */
function followedIn(id){
  const out = [];
  for (const nm of followList()) {
    const P = S.persons[nm];
    const hit = P ? P.credits.some(c => c.id === id) : credits(id).d.concat(credits(id).c).some(p => p.id === nm);
    if (hit) out.push(nm);
  }
  return out;
}
function stampAndCelebrate(id, patch){
  const ppl = followedIn(id);
  const before = Object.fromEntries(ppl.map(nm => [nm, personStat(nm)]));
  setMark(id, patch);
  const msgs = [], unlocks = [], evolves = [];
  for (const nm of ppl) {
    const a = before[nm], b = personStat(nm); if (!b) continue;
    const name = S.people[nm]?.cn || S.persons[nm]?.db?.cn || S.persons[nm]?.n || nm;
    if (b.seen > (a?.seen || 0)) msgs.push(`♥ ${name} ${b.seen}/${b.tot}`);
    const ta = a ? tierOf(a.seen, a.tot) : null, tb = tierOf(b.seen, b.tot);
    if (ta && tb.i > ta.i) evolves.push({nm, from: ta.r, to: tb.r, b});
    for (const bd of BADGES) if (bd.t(b.seen, b.tot) && !(a && bd.t(a.seen, a.tot))) unlocks.push({bd, nm, name, b});
  }
  if (evolves.length) { const e = evolves[evolves.length - 1]; setTimeout(() => ceremonyEvolve(e.nm, e.from, e.to, e.b), 650); }
  else if (unlocks.length) setTimeout(() => ceremony(unlocks[unlocks.length - 1]), 650);
  return msgs;
}
function ceremony(u){
  const photo = S.people[u.nm]?.dimg || imdbImg(S.persons[u.nm]?.img, 300);
  const el = document.createElement("div"); el.className = "cere";
  el.innerHTML = `<div class="cc"><div class="cbadge">${u.bd.ic}</div><div class="ct">解锁「${u.bd.n}」</div>
    <div class="cp">${photo ? `<img src="${esc(photo)}" onerror="this.remove()">` : ""}<b>${esc(u.name)}</b></div>
    <div class="cn">已集 ${u.b.seen} / ${u.b.tot} 部</div>${badgeRow(u.b.seen, u.b.tot)}<button class="btn" style="background:var(--rose);margin-top:16px">收下</button></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("on"));
  setTimeout(() => burst(el.querySelector(".cbadge"), 18), 250);
  el.onclick = () => { el.classList.remove("on"); setTimeout(() => el.remove(), 300); };
}

function refreshPersonCounts(nm){

/* ================================================================ GitHub 同步 */
const gh = {
  token(){ return getPref("ghToken", ""); },
  repo(){
    const saved = getPref("ghRepo", ""); if (saved) return saved;
    const h = location.hostname; if (!h.endsWith(".github.io")) return "";
    const owner = h.split(".")[0], first = location.pathname.split("/").filter(Boolean)[0];
    return `${owner}/${first || h}`;
  },
  dataRepo(){ const s = getPref("ghDataRepo", ""); if (s) return s; const r = gh.repo(); return r ? `${r.split("/")[0]}/${r.split("/")[1]}-data` : ""; },
  async req(repo, method, path, body, accept){
    let r;
    try {
      r = await fetch(`https://api.github.com/repos/${repo}${path}`, {method, cache: "no-store",
        headers: {Authorization: `Bearer ${gh.token()}`, Accept: accept || "application/vnd.github+json"}, body: body ? JSON.stringify(body) : undefined});
    } catch { throw new Error("连不上 GitHub，可能要开一下网络环境。改动已存在手机上，下次会自动同步。"); }
    if (r.status === 401) throw new Error("GitHub 密钥无效或已过期，请到设置里重新填写");
    if (r.status === 403) throw new Error("密钥权限不够：Contents 要选 Read and write");
    if (r.status === 404 && method !== "GET") throw new Error(`找不到仓库 ${repo}，确认已经建好、密钥里也选了它`);
    return r;
  },
  data(method, path, body, accept){ return gh.req(gh.dataRepo(), method, path, body, accept); },
  site(method, path, body){ return gh.req(gh.repo(), method, path, body); },
};
const b64e = s => { const b = new TextEncoder().encode(s); let o = ""; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(o); };
async function readJSON(path){
  const r = await gh.data("GET", `/contents/${path}?t=${Date.now()}`, null, "application/vnd.github.raw+json");
  if (r.status === 404) return {data: null, sha: null};
  if (!r.ok) throw new Error(`读取 ${path} 失败（HTTP ${r.status}）`);
  const text = await r.text();
  let data = null; try { data = JSON.parse(text); } catch {}
  return {data, sha: (r.headers.get("etag") || "").replace(/^W\//, "").replace(/"/g, "") || null, text};
}
async function shaOf(path){
  const r = await gh.data("GET", `/contents/${path}?t=${Date.now()}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`读取 ${path} 失败（HTTP ${r.status}）`);
  return (await r.json()).sha;
}
async function writeJSON(path, mutate, message){
  for (let i = 0; i < 4; i++) {
    const [{data}, sha] = await Promise.all([readJSON(path), shaOf(path)]);
    const next = mutate(data);
    const r = await gh.data("PUT", `/contents/${path}`, {message, sha: sha || undefined, content: b64e(JSON.stringify(next) + "\n")});
    if (r.ok) return next;
    if (r.status !== 409 && r.status !== 422) throw new Error(`保存失败（HTTP ${r.status}）`);
    await new Promise(r => setTimeout(r, 600 + i * 800));
  }
  throw new Error("保存冲突，请稍后再试");
}
function mergeMarks(a, b){
  const out = {...a};
  for (const [id, x] of Object.entries(b || {})) if (!out[id] || (x.t || 0) > (out[id].t || 0)) out[id] = x;
  return out;
}
let saveT = 0, saving = false;

async function pollFile(path, ok, seconds){
  const end = Date.now() + seconds * 1000;
  await new Promise(r => setTimeout(r, 20000));

let watching = false;

let metaSig = "";
async function pullMeta(){

  const sig = (m.text || "").length + ":" + (p.text || "").length + ":" + (ps.text || "").length + ":" + (m.text || "").slice(-200);
  if (sig === metaSig) return false;    // 没变就不重画

  if (p.data) { S.people = p.data; kv.set("people", p.data); }

async function pullAll(){
  if (!gh.token() || IS_PREVIEW) return;

    const [mk, st] = await Promise.all([readJSON("marks.json"), readJSON("status.json")]);
    const remote = (mk.data && mk.data.items) || {}, rf = (mk.data && mk.data.follows) || {};
    const merged = mergeMarks(remote, S.marks), mf = mergeMarks(rf, S.follows);
    const changedLocal = Object.keys(merged).some(id => merged[id] !== remote[id]) || Object.keys(mf).some(id => mf[id] !== rf[id]);
    const changedRemote = Object.keys(remote).some(id => S.marks[id]?.t !== remote[id]?.t) || Object.keys(rf).some(id => S.follows[id]?.t !== rf[id]?.t);
    S.follows = mf; kv.set("follows", mf);

    setPref("pendingIds", [...S.pending]);
    // 有些标记了但还没详情的（比如另一台手机上加的），补一下
    const missing = active().map(([id]) => id).filter(id => !S.meta[id] || S.meta[id].light);

    if (changedRemote || metaChanged || !S.firstSync || route().name === "settings") render();
    S.firstSync = true;
  } catch (e) { const had = S.syncErr; S.syncErr = e.message; if (had !== e.message) { bump(); render(); } }
}
function syncBanner(){
  if (IS_PREVIEW) return `<div class="note" style="margin-top:4px"><div class="bd">这是预览版：数据是示例，改动只存在这台设备上。</div></div>`;
  if (!gh.token()) return active().length ? `<div class="note" style="margin-top:4px"><div class="bd">标记只存在这台手机上。连接 GitHub 后可以同步、补全详情和评分。</div><button onclick="go('#/settings')">去连接</button></div>` : "";
  if (S.syncErr) return `<div class="note" style="margin-top:4px;background:#fdecea;color:#a3352a"><div class="bd">${esc(S.syncErr)}</div><button style="color:#a3352a" onclick="S.syncErr='';pullAll()">重试</button></div>`;
  return "";
}

/* ================================================================ 设置 */
function renderSettings(){
  const st = S.status?.sources || {};
  const NAMES = {imdb: "IMDb", douban: "豆瓣", rt: "烂番茄", wikidata: "Wikidata（编号对照）", search: "在线搜索"};
  $("#page").innerHTML = `<div class="bar solid"><button class="icon-btn" onclick="back()" aria-label="返回">${IC.back}</button><div class="tt">设置</div><span style="width:36px"></span></div>
    <div style="padding:0 var(--pad)">
    <div class="set-sec"><h4>GitHub 同步</h4><div class="set-card" style="padding:14px">
      ${gh.token() ? `<div style="display:flex;align-items:center;gap:8px"><span class="dot"></span><b style="flex:1;font-weight:500">已连接</b><button class="pill add" id="unlink">断开</button></div>
        <div class="small" style="margin-top:6px">网站仓库 ${esc(gh.repo())}<br>数据仓库 ${esc(gh.dataRepo())}${S.synced ? `<br>上次同步 ${new Date(S.synced).toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"})}` : ""}</div>`
      : `<div class="small" style="margin-bottom:10px">粘贴 GitHub 密钥（fine-grained token），需要勾选 <b>${esc(gh.repo() || "movie-library")}</b> 和 <b>${esc(gh.dataRepo() || "movie-library-data")}</b> 两个仓库，权限 Contents 和 Actions 都选 Read and write。</div>
        <input class="field" id="tok" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn acc" id="link" style="width:100%;margin-top:10px">连接</button>`}
      <details style="margin-top:12px"><summary class="small">仓库名不一样？</summary>
        <input class="field" id="repo" placeholder="网站仓库，如 name/movie-library" value="${esc(getPref("ghRepo", ""))}" style="margin-top:8px">
        <input class="field" id="drepo" placeholder="数据仓库，如 name/movie-library-data" value="${esc(getPref("ghDataRepo", ""))}" style="margin-top:8px">
        <button class="pill add" id="saverepo" style="margin-top:8px">保存</button></details>
    </div></div>
    ${Object.keys(st).length ? `<div class="set-sec"><h4>数据源${S.status?.updated ? ` · 后台上次运行 ${esc(S.status.updated.slice(5, 16).replace("T", " "))}` : ""}</h4><div class="set-card">
      ${Object.entries(st).map(([k, s]) => `<div class="opt"><span class="dot ${s.ok ? "" : "bad"}"></span><span class="k">${NAMES[k] || k}</span><b style="max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.msg)}</b></div>`).join("")}</div></div>` : ""}
    <div class="set-sec"><h4>离线片库</h4><div class="set-card"><div class="opt"><span class="k">收录</span><b>${S.idxInfo ? `${S.idxInfo.titles.toLocaleString()} 部` : S.idxReady < 0 ? "加载失败" : "加载中"}</b></div>
      <div class="opt"><span class="k">更新于</span><b>${S.idxInfo ? esc(S.idxInfo.built.slice(0, 10)) : "—"}</b></div></div>
      <div class="small" style="margin-top:6px">每天用 IMDb 官方数据集更新，收录有一定人气的电影和剧集，以及近期、待映的热门片。搜不到的冷门片可以用在线搜索。</div></div>
    <div class="set-sec"><h4>备份</h4><div class="set-card"><div class="opt" id="exp"><span class="k">导出全部标记（JSON）</span>›</div>
      <label class="opt"><span class="k">从备份恢复</span>›<input type="file" id="imp" accept="application/json" class="hide"></label></div></div>
    <div class="small" style="margin:20px 0 30px;text-align:center">数据来自 IMDb、豆瓣、烂番茄，仅供个人使用。</div></div>`;
  const link = $("#link");
  if (link) link.onclick = async () => {
    const t = $("#tok").value.trim(); if (!t) return;
    setPref("ghToken", t); link.disabled = true; link.textContent = "连接中…";
    try {
      const r = await gh.data("GET", "");
      if (!r.ok) throw new Error(r.status === 404 ? `找不到数据仓库 ${gh.dataRepo()}，确认已经建好、密钥里勾选了它` : `连接失败（HTTP ${r.status}）`);
      toast("连接成功，正在同步"); await pullAll(); render();
    } catch (e) { setPref("ghToken", ""); toast(e.message); link.disabled = false; link.textContent = "连接"; }
  };
  const ul = $("#unlink"); if (ul) ul.onclick = () => { setPref("ghToken", ""); render(); };
  $("#saverepo").onclick = () => { setPref("ghRepo", $("#repo").value.trim()); setPref("ghDataRepo", $("#drepo").value.trim()); toast("已保存"); render(); };
  $("#exp").onclick = () => {
    const blob = new Blob([JSON.stringify({exported: new Date().toISOString(), items: S.marks, follows: S.follows}, null, 1)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `影库备份-${today()}.json`; a.click();
  };
  $("#imp").onchange = async e => {
    try { const j = JSON.parse(await e.target.files[0].text()); const n = Object.keys(j.items || {}).length; if (!n) throw 0;
      S.marks = mergeMarks(S.marks, j.items); S.follows = mergeMarks(S.follows, j.follows || {}); kv.set("follows", S.follows); Object.keys(j.items).forEach(id => { if (!S.meta[id]) S.pending.add(id); }); persistLocal(); scheduleSave(); toast(`已恢复 ${n} 条标记`); }
    catch { toast("这个文件不是影库的备份"); }
  };
}

/* ================================================================ 启动 */
(async function boot(){
  if (window.__PREVIEW__) {
    const P = window.__PREVIEW__;
    S.marks = P.marks; S.meta = P.meta; S.people = P.people; S.status = P.status; S.follows = P.follows || {}; S.persons = P.persons || {};
  } else {
    const [mk, mt, pp, fo, ps] = await Promise.all([kv.get("marks"), kv.get("meta"), kv.get("people"), kv.get("follows"), kv.get("persons")]);
    S.marks = mk || {}; S.meta = mt || {}; S.people = pp || {}; S.follows = fo || {}; S.persons = ps || {}; S.status = getPref("status", null);
  }
  render();
  loadIndex();
  pullAll();
  if (S.pending.size && gh.token()) watchPending();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - (S.synced || 0) > 60000) pullAll(); });
  if ("serviceWorker" in navigator && !IS_PREVIEW && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
