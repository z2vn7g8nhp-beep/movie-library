name: 补全详情和评分

on:
  schedule:
    - cron: "41 */6 * * *"    # 每 6 小时刷新一轮评分；网页上标记后会立刻叫它跑一次
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 取离线片库里的中文片名（豆瓣按名字找条目时用）
        run: |
          mkdir -p idx
          if git fetch --depth=1 origin index 2>/dev/null; then
            git archive FETCH_HEAD s1.txt s2.txt | tar -x -C idx || true
          fi

      - name: 取私有数据仓库
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          repo="${DATA_REPO:-${{ github.repository }}-data}"
          git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/${repo}.git" data
          echo "DATA_URL=https://x-access-token:${DATA_TOKEN}@github.com/${repo}.git" >> "$GITHUB_ENV"

      - name: 补全
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}    # 可选：填了就推送追的人的生日和新作
        run: python scraper/sync.py --data data --idx idx

      - name: 保存
        run: |
          cd data
          git config user.name "movie-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json people.json status.json lookup.json requests.json 2>/dev/null || true
          git add -A
          git diff --cached --quiet && { echo "没有变化"; exit 0; }
          git commit -q -m "补全详情 $(TZ=Asia/Shanghai date '+%m-%d %H:%M')"
          if ! git ls-remote --exit-code --heads origin >/dev/null 2>&1; then
            git push -q origin HEAD:main && exit 0    # 数据仓库还是空的，第一次推
          fi
          ok=0
          for i in 1 2 3 4; do
            # 网页可能刚好也在写 marks.json / requests.json，先合并再推（这次提交不碰这两个文件，所以不会盖掉网页的改动）
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((i * 3))
          done
          [ "$ok" = 1 ] || { echo "保存失败"; exit 1; }

      - name: 清掉处理过的请求（只删这次做过的，运行期间网页新加的留着）
        run: |
          [ -f processed_requests.json ] || exit 0
          cd data
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD
            python ../scraper/clear_requests.py requests.json ../processed_requests.json
            git add requests.json
            git diff --cached --quiet && exit 0
            git commit -q -m "清掉处理过的请求" && git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done

      - name: 防止 GitHub 60 天无活动自动停用定时任务
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable" || true
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable" || true
          f=.github/keepalive.txt
          last=$(cat "$f" 2>/dev/null || echo 0); now=$(date +%s)
          if [ $((now - last)) -gt 2160000 ]; then
            echo "$now" > "$f"
            git config user.name "movie-library-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f" && git commit -q -m "保活" && git push -q || echo "保活提交没成功，下次再试"
          fi
